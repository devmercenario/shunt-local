name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  evals:
    name: Evals (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq bubblewrap python3-yaml

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install jq
          python3 -m pip install --user pyyaml || true

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install jq -y --no-progress

      - name: Provide python3 alias (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec python "$@"\n' > "$HOME/.local/bin/python3"
          chmod +x "$HOME/.local/bin/python3"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run eval suite
        run: bash evals/run.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (CLI, no license required)
        run: |
          url=$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux_x64.tar.gz$")) | .browser_download_url')
          curl -sSL "$url" | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan
        run: gitleaks detect --source . --no-banner --redact --exit-code 1
